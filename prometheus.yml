global:
  scrape_interval:     15s 

alerting:
 alertmanagers:
   - static_configs:
       - targets:  [alert-manager:9093]

rule_files:
  - "alerting.rules.yaml"
         
scrape_configs:

  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: "linux servers"
    static_configs:
      - targets: ["52.2.157.132:9100", "54.164.24.119:9100"]
  
  - job_name: "flask app"
    static_configs:
      - targets: ["flask-app:8050"]
  
